
name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        run: |
          ZIP_FILE="noghreyar-nextjs-starter.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Project ZIP file not found."
            exit 1
          fi

          mkdir -p /tmp/noghreyar-project
          unzip -q "$ZIP_FILE" -d /tmp/noghreyar-project

          cp -R /tmp/noghreyar-project/. .

          rm -f "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract Noghreyar project files"
            git push
          fi
